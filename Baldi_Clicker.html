<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baldi Clicker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #66d66a, #159447);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    user-select: none;
  }
  .game {
    width: min(900px, 94vw);
    min-height: 620px;
    background: rgba(0,0,0,.28);
    border: 4px solid #fff;
    border-radius: 24px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.3);
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(38px, 7vw, 68px);
    text-shadow: 4px 4px 0 #000;
  }
  .score {
    font-size: 34px;
    font-weight: bold;
    margin: 10px 0 18px;
  }
  .click-zone {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 330px;
  }
  #baldi {
    width: 180px;
    height: auto;
    image-rendering: pixelated;
    cursor: pointer;
    filter: drop-shadow(0 10px 5px rgba(0,0,0,.35));
    transition: transform .08s;
  }
  #baldi:active { transform: scale(.9) rotate(-2deg); }
  .buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    border: 3px solid #111;
    border-radius: 12px;
    padding: 13px 20px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    background: #ffd83d;
    box-shadow: 0 5px 0 #111;
  }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 #111; }
  #message {
    height: 30px;
    margin-top: 16px;
    font-size: 20px;
    font-weight: bold;
  }
  .pop {
    position: fixed;
    pointer-events: none;
    font-size: 28px;
    font-weight: bold;
    color: #fff;
    text-shadow: 2px 2px #000;
    animation: pop .65s ease-out forwards;
  }
  @keyframes pop {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to { opacity: 0; transform: translateY(-80px) scale(1.3); }
  }
</style>
</head>
<body>

  <div class="buttons">
    <button id="upgrade">Upgrade Click (+1) — 25 clicks</button>
    <button id="reset">Reset Game</button>
  </div>
  <div id="message">Click Baldi!</div>
</div>

<script>
let score = Number(localStorage.getItem("baldiScore") || 0);
let power = Number(localStorage.getItem("baldiPower") || 1);
let cost = Number(localStorage.getItem("baldiCost") || 25);

const scoreEl = document.getElementById("score");
const baldi = document.getElementById("baldi");
const upgrade = document.getElementById("upgrade");
const reset = document.getElementById("reset");
const message = document.getElementById("message");

function save() {
  localStorage.setItem("baldiScore", score);
  localStorage.setItem("baldiPower", power);
  localStorage.setItem("baldiCost", cost);
}

function update() {
  scoreEl.textContent = score;
  upgrade.textContent = `Upgrade Click (+${power + 1}) — ${cost} clicks`;
}

function popup(e) {
  const p = document.createElement("div");
  p.className = "pop";
  p.textContent = "+" + power;
  p.style.left = (e.clientX - 15) + "px";
  p.style.top = (e.clientY - 20) + "px";
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 650);
}

baldi.addEventListener("click", (e) => {
  score += power;
  message.textContent = power > 1 ? `Baldi gives you ${power} clicks!` : "CLICK BALDI!";
  popup(e);
  save();
  update();
});

upgrade.addEventListener("click", () => {
  if (score >= cost) {
    score -= cost;
    power++;
    cost = Math.ceil(cost * 1.65);
    message.textContent = "Baldi Click Power upgraded!";
    save();
    update();
  } else {
    message.textContent = `You need ${cost - score} more clicks!`;
  }
});

reset.addEventListener("click", () => {
  if (confirm("Reset Baldi Clicker?")) {
    score = 0;
    power = 1;
    cost = 25;
    save();
    update();
    message.textContent = "Game reset!";
  }
});

update();
</script>
